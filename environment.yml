name: vydra
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - git-lfs
  # Install GPU-enabled torch and faiss from conda so they do not get replaced
  # by pip requirements. This build supports both CPU and CUDA inference.
  - pytorch
  - pytorch-cuda=12.1
  - faiss-gpu=1.14.1
  - pip:
      - -r requirements-vydra-gpu.txt
